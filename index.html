<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my calculator</title>
    
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="calculator">
        <h2>CALCULATOR</h2>
        <input type="text" class="display" value="0"readonly > <br><br>
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="functioner">/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="functioner">*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="functioner">-</button>

            <button>0</button>
            <button>.</button>
            <button class="functioner">%</button>
            
            <button class="functioner">+</button>
            

            <button class="equals">=</button>

            <button class="clear">del</button>
            <button class="clear">c</button>
            
        
        </div>
    </div>

    
</body>
</html>
